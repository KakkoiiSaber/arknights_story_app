name: arknights_story_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.8+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  audio_session: ^0.2.2
  supabase_flutter: 2.18.3
  http: ^1.2.0
  visibility_detector: ^0.4.0
  web: ^1.1.1
  flutter_inappwebview: 6.1.5
  path_provider: 2.1.5
  crypto: 3.0.7
  archive: 4.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  rename_app: ^1.3.1


flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  macos:
    generate: true
  image_path: "lib/assets/icon.png"   # replace with your icon path


flutter:
  uses-material-design: true
  fonts:
    - family: Archive Sans
      fonts:
        - asset: lib/assets/fonts/NotoSansSC.ttf
          weight: 400
        - asset: lib/assets/fonts/NotoSansSC.ttf
          weight: 500
        - asset: lib/assets/fonts/NotoSansSC.ttf
          weight: 600
        - asset: lib/assets/fonts/NotoSansSC.ttf
          weight: 700
    - family: Archive Condensed
      fonts:
        - asset: lib/assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
  assets:
    - lib/assets/data/story_themes.json
    - lib/assets/fonts/NotoSansSC-OFL.txt
    - lib/assets/fonts/BarlowCondensed-OFL.txt
    - lib/assets/prts_player.zip
