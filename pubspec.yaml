name: arknights_story_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.2+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  audio_session: ^0.2.2
  http: ^1.2.0
  visibility_detector: ^0.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  rename_app: ^1.3.1


flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  macos:
    generate: true
  image_path: "lib/assets/icon.png"   # replace with your icon path


flutter:
  uses-material-design: true
