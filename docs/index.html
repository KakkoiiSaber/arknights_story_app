<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/arknights_story_app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="arknights_story_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>方舟档案馆</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; background: #141718; color: #e4e8e7; }
    #startup { position: fixed; inset: 0; z-index: 1; display: grid; place-content: center;
      text-align: center; background: #141718; font: 16px/1.6 system-ui, sans-serif; }
    #startup strong { font-size: 24px; letter-spacing: .12em; }
    #startup p { color: #b1bcbe; }
    #startup button { justify-self: center; padding: .45em 1.3em; border: 1px solid #697477;
      background: transparent; color: inherit; font: inherit; cursor: pointer; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup" role="status">
    <strong>方舟档案馆</strong>
    <p id="startup-status">正在加载阅读界面…</p>
    <button type="button" hidden onclick="location.reload()">重新加载</button>
    <noscript>请启用 JavaScript 后重新打开。</noscript>
  </div>
  <script>
    const startup = document.getElementById('startup');
    function showRetry(message) {
      startup.querySelector('p').textContent = message;
      startup.querySelector('button').hidden = false;
    }
    const startupTimer = setTimeout(() => showRetry('加载时间较长，可以继续等待或重试。'), 20000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(startupTimer);
      startup.remove();
    }, { once: true });
    window.addEventListener('error', event => {
      if (event.target instanceof HTMLScriptElement && startup.isConnected) {
        clearTimeout(startupTimer);
        showRetry('启动文件加载失败，请检查网络后重试。');
      }
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
