name: Flutter Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Build APK (per abi)
        run: flutter build apk --release --split-per-abi
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Build web
        run: flutter build web --release
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-tools gstreamer1.0-x
          flutter pub get
      - name: Build Linux (bundle)
        run: flutter build linux --release
      - name: Package tar.gz
        run: |
          cd build/linux/x64/release
          tar -zcvf linux-bundle.tar.gz bundle
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/x64/release/linux-bundle.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Build macOS app
        run: flutter build macos --release
      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/arknights_story_app.app"
          DMG_NAME="arknights_story_app-macos.dmg"
          hdiutil create "$DMG_NAME" -volname "ArknightsStoryApp" -fs HFS+ -srcfolder "$APP_PATH"
        shell: bash
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: arknights_story_app-macos.dmg

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Build unsigned IPA
        run: |
          flutter build ipa --release --no-codesign
        shell: bash
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios/ipa/*.ipa

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install deps
        run: flutter pub get
        shell: bash
      - name: Build Windows
        run: flutter build windows --release
        shell: bash
      - name: Package zip (unsigned)
        run: |
          cd build/windows/x64/runner/Release
          powershell -Command "Compress-Archive * ../../../arknights_story_app-windows.zip"
      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/arknights_story_app-windows.zip

  release:
    needs:
      - build-android
      - build-web
      - build-linux
      - build-macos
      - build-ios
      - build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
