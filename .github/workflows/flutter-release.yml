name: Flutter Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-apk
            os: ubuntu-latest
            build: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk

          - name: android-aab
            os: ubuntu-latest
            build: flutter build appbundle --release
            artifact: build/app/outputs/bundle/release/app-release.aab

          - name: web
            os: ubuntu-latest
            build: flutter build web --release
            artifact: build/web

          - name: linux
            os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
            build: flutter build linux --release
            artifact: build/linux/**/release/bundle

          - name: windows
            os: windows-latest
            build: flutter build windows --release
            artifact: build/windows/**/runner/Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Platform setup
        if: ${{ matrix.setup != '' }}
        shell: bash
        run: ${{ matrix.setup }}

      - name: Build
        shell: bash
        run: ${{ matrix.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
