name: Flutter App Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Package Android
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             release/arknights_story_android_arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             release/arknights_story_android_armeabi.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
             release/arknights_story_android_x86_64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-tools gstreamer1.0-x
          flutter pub get
      - run: flutter build linux --release

      - name: Package Linux
        run: |
          mkdir -p release
          tar -zcvf "$GITHUB_WORKSPACE/release/arknights_story_linux.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package macOS
        run: |
          mkdir -p release
          APP_PATH="$(find build/macos/Build/Products/Release -name '*.app' | head -n1)"
          hdiutil create "$GITHUB_WORKSPACE/release/arknights_story_macos.dmg" \
            -volname "ArknightsStory" \
            -fs HFS+ \
            -srcfolder "$APP_PATH"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*
          retention-days: 1

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package iOS
        run: |
          mkdir -p release
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "$GITHUB_WORKSPACE/release/arknights_story_ios.ipa" Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: release/*
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - shell: bash
        run: flutter pub get
      - shell: bash
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath release/arknights_story_windows.zip `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          retention-days: 1

  release:
    needs:
      - build-android
      - build-linux
      - build-macos
      - build-ios
      - build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Debug release files
        run: ls -R release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
