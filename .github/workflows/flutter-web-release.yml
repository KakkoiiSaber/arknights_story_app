name: Flutter Web Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-web-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build PRTS player host
        run: |
          npm ci
          npm run test:player
          npm run check:player
          npm run build:player

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          dart run tool/package_player.dart
          flutter build web --release --base-href /arknights_story_app/
          npm run stage:player

      - name: Update docs folder
        run: |
          rm -rf docs
          mv build/web docs
          touch docs/.nojekyll

      - name: Commit & push web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore(web): update Flutter web build" || echo "No changes"
          git push origin main
