<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRTS StoryPlayer</title>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; background:#050709; color:#eee; font:14px system-ui,sans-serif; }
    body { display:flex; flex-direction:column; }
    header { height:44px; flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 12px; background:#10161c; }
    #title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    button { cursor:pointer; color:#eee; background:#25333e; border:1px solid #647683; padding:8px 14px; border-radius:3px; }
    button:disabled { opacity:.45; cursor:default; }
    select { color:#eee; background:#25333e; border:1px solid #647683; padding:7px; border-radius:3px; max-width:130px; }
    main { flex:1; min-height:0; position:relative; display:grid; place-items:center; overflow:hidden; }
    #stage { width:min(100vw, calc((100dvh - 44px) * 16 / 9)); aspect-ratio:16/9; outline:none; position:relative; }
    #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#050709dd; padding:24px; }
    #overlay[hidden] { display:none; }
    .card { width:min(460px,100%); text-align:center; line-height:1.7; }
    #status { white-space:pre-wrap; overflow-wrap:anywhere; }
    progress { display:block; width:100%; margin:18px 0; accent-color:#8ed7e7; }
    #hint { color:#9eabb7; font-size:12px; }
    @media (orientation:portrait) { #hint::after { content:' · 横屏观看效果更好'; } }
    @media (max-width:600px) { header { gap:4px; padding:0 6px; } button,select { padding:6px; } }
  </style>
</head>
<body>
  <header><button id="return" hidden>返回主题页</button><span id="title">PRTS StoryPlayer</span><select id="resources" aria-label="资源来源"><option value="github">GitHub Raw</option><option value="prts">PRTS CDN</option></select><button id="restart" disabled>重新阅读</button><button id="fullscreen">全屏</button></header>
  <main>
    <div id="stage" tabindex="0" role="button" aria-label="剧情画面，点击或按空格推进"></div>
    <div id="overlay"><div class="card"><h2 id="heading">正在载入剧情</h2><p id="status" role="status">准备资源…</p><progress id="progress" max="1" value="0"></progress><button id="start" disabled>开始阅读</button><p id="hint">PRTS 上游演出引擎 · 点击画面或按空格推进</p></div></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
